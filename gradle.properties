# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G

minecraft_version=1.20.1
minecraft_version_range=[1.20,1.21)
forge_version=47.4.13
# The forge version range can use any version of forge or match the loader version range
forge_version_range=[47.4,)
# The loader version range can only be the major version of Forge/FML
loader_version_range=[47,)
mappings_channel=parchment
mappings_version=2023.07.09-1.20.1

mod_id=grappleunbound
mod_name=Grapple Unbound
mod_version=1.0.2
mod_base_package=net.camacraft.grappleunbound
mod_authors=Yyon, Nyfaria, Mayesnake, Chummycho, and Cama
mod_description=Grappling hooks, ender staffs and wall-running for Minecraft 1.20.1, working with Valkyrien Skies ships. A fork of yyon's Grappling Hook Mod (Grappling Hook Mod: Reforged), formerly GrappleVS.
mod_archive_base=grappleunbound

# Dependencies
# Camafy (shared library, required)
# 0.1.7: Gravity.strength is the real local gravity (0 in VS Genesis space and Ad Astra orbits)
camafy_version=0.1.7
camafy_version_range=[0.1.7,0.2)
# Valkyrien Skies core version matching valkyrienskies-120-forge 2.4.11 (from its POM)
vs_core_version=1.1.0+cf208d8b56
jei_version=15.2.0.27
