modLoader="javafml"
loaderVersion="${loader_version_range}"

license="GPL-3.0"
issueTrackerURL="https://github.com/Camawama/GrappleUnbound/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Camawama/GrappleUnbound"
authors="${mod_authors}"
credits='''Based on yyon's Grappling Hook Mod (https://github.com/yyon/grapplemod) and its 1.20.1 port Grappling Hook Mod: Reforged. Upstream credits: 1.18 update by Nyfaria, textures by Mayesnake, and the contributors listed in the README. Formerly GrappleVS. Licensed GPL-3.0.'''
description='''${mod_description}'''
logoFile="icon.png"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
    modId="cloth_config"
    mandatory=true
    versionRange="[11,12)"
    ordering="NONE"
    side="BOTH"

# Shared library; the Valkyrien Skies integration goes through it.
[[dependencies.${mod_id}]]
    modId="camafy"
    mandatory=true
    versionRange="${camafy_version_range}"
    ordering="AFTER"
    side="BOTH"

# Optional integration, reached through Camafy (whose ship support needs VS 2.4.11 or newer);
# tested against VS 2.4.x, so bump the upper bound deliberately after testing newer releases.
[[dependencies.${mod_id}]]
    modId="valkyrienskies"
    mandatory=false
    versionRange="[2.4.11,2.5.0)"
    ordering="AFTER"
    side="BOTH"
